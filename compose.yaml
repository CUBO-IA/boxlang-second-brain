name: second-brain

services:
  frontend:
    build:
      context: ./frontend
    init: true
    environment:
      BOXLANG_URL: http://boxlang:8080
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend/app:/app/app:ro
      - ./tests:/tests:ro
    depends_on:
      boxlang:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  boxlang:
    build:
      context: .
    init: true
    environment:
      BOXLANG_CONFIG: /modules/second-brain/config/boxlang.json
      REWRITES: "false"
      APP_ORIGIN: ${APP_ORIGIN:-http://127.0.0.1:${FRONTEND_PORT:-3000}}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      P00_ALLOW_PROVIDER_CALLS: ${P00_ALLOW_PROVIDER_CALLS:-NO}
      P00_MAX_USD: ${P00_MAX_USD:-1}
      P00_PRICE_DATE: ${P00_PRICE_DATE:-2026-10-11}
      P00_PRICE_REFERENCE: ${P00_PRICE_REFERENCE:-https://developers.openai.com/api/docs/pricing}
      P00_CHAT_INPUT_USD_PER_MILLION: ${P00_CHAT_INPUT_USD_PER_MILLION:-0.10}
      P00_CHAT_OUTPUT_USD_PER_MILLION: ${P00_CHAT_OUTPUT_USD_PER_MILLION:-0.50}
      P00_EMBED_USD_PER_MILLION: ${P00_EMBED_USD_PER_MILLION:-0.02}
      BUDGET_DAILY_USD: ${BUDGET_DAILY_USD:-20}
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-second_brain}
      POSTGRES_USER: ${POSTGRES_USER:-second_brain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}
    volumes:
      - .:/modules/second-brain:ro
      - ./backend:/app:ro
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/api/health.bxm"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  postgres:
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-second_brain}
      POSTGRES_USER: ${POSTGRES_USER:-second_brain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres_data:
